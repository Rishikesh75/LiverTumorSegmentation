# Production: do not allow in-memory dev credentials
app.auth.dev-login-enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/livertumor;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Completion email after successful POST /api/segment (set APP_NOTIFICATION_EMAIL_ENABLED=true and mail credentials)
app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:false}
app.notification.email.subject-prefix=${APP_NOTIFICATION_EMAIL_SUBJECT_PREFIX:Liver tumor segmentation}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
