# Docker-specific configuration
# This profile is activated when running in Docker environment

# ML Service Configuration (Docker network)
ml.service.url=http://ml-service:5000
ml.service.timeout=300000

# Logging Configuration
logging.level.com.livertumor.segmentation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

