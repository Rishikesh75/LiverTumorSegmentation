# Server Configuration
server.port=8080
spring.application.name=Liver Tumor Segmentation Backend

# Database (H2 in-memory dev; override with SPRING_DATASOURCE_* in prod)
spring.datasource.url=jdbc:h2:mem:livertumor;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# File Storage Configuration
file.upload-dir=uploads
file.output-dir=outputs

# ML Service Configuration
ml.service.url=http://localhost:5000
ml.service.timeout=300000
ml.service.model-version=1.0.0

# Async jobs / public URLs in JSON responses (browser must reach this host)
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.jobs.max-concurrent=${APP_JOBS_MAX_CONCURRENT:2}
app.retention.days=${APP_RETENTION_DAYS:90}
app.retention.cron=${APP_RETENTION_CRON:0 0 4 * * *}
app.storage.encryption-enabled=${APP_STORAGE_ENCRYPTION_ENABLED:false}

# Actuator (readiness components also exposed at /api/health/ready)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logging Configuration
logging.level.com.livertumor.segmentation=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Google OAuth2 (set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET env vars or use gitignored application-local.properties)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-oauth-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-oauth-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Redirect browser here after successful OAuth (SPA origin)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Dev password login for POST /api/auth/login (off when spring.profiles.active includes prod)
app.auth.dev-login-enabled=true
app.auth.dev-email=${APP_DEV_LOGIN_EMAIL:dev@example.com}
app.auth.dev-password=${APP_DEV_LOGIN_PASSWORD:changeme}

# Gmail notification after successful POST /api/segment (off by default)
app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:false}
app.notification.email.subject-prefix=${APP_NOTIFICATION_EMAIL_SUBJECT_PREFIX:Liver tumor segmentation}

# SMTP — use a Gmail address + [App Password](https://support.google.com/accounts/answer/185833) when 2FA is on
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

